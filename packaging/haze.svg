<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140f1c"/>
      <stop offset="0.55" stop-color="#2b1d26"/>
      <stop offset="1" stop-color="#5a3826"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#f3a35c" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#c46a3c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#c46a3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d241c"/>
      <stop offset="1" stop-color="#180e0c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c46a3c"/>
      <stop offset="1" stop-color="#f6b86e"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.42" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbf6f0"/>
      <stop offset="0.7" stop-color="#e6dbcf"/>
      <stop offset="1" stop-color="#bfae9d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="knobshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background (Mist dusk) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="380" r="240" fill="url(#sun)"/>
  <path d="M 0,380 Q 140,320 280,360 T 512,340 L 512,512 L 0,512 Z" fill="url(#dune)"/>

  <!-- Glass card -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Scale: ticks + value arc (cranked past 7) -->
    <line x1="188.1" y1="303.9" x2="179.6" y2="312.4" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="164.7" y1="265.7" x2="153.3" y2="269.4" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="161.2" y1="221.0" x2="149.3" y2="219.1" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="178.3" y1="179.6" x2="168.6" y2="172.5" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="212.4" y1="150.5" x2="207.0" y2="139.8" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="256.0" y1="140.0" x2="256.0" y2="128.0" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="299.6" y1="150.5" x2="305.0" y2="139.8" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="333.7" y1="179.6" x2="343.4" y2="172.5" stroke="#f3a35c" stroke-opacity="0.95" stroke-width="5" stroke-linecap="round"/>
  <line x1="350.8" y1="221.0" x2="362.7" y2="219.1" stroke="#f5efe9" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <line x1="347.3" y1="265.7" x2="358.7" y2="269.4" stroke="#f5efe9" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <line x1="323.9" y1="303.9" x2="332.4" y2="312.4" stroke="#f5efe9" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  <path d="M 198.0,294.0 A 82 82 0 1 1 327.0,195.0" fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M 198.0,294.0 A 82 82 0 1 1 327.0,195.0" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round"/>

  <!-- Knob -->
  <circle cx="256" cy="236" r="60" fill="url(#cap)" filter="url(#knobshadow)"/>
  <circle cx="256" cy="236" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
  <line x1="271.6" y1="227.0" x2="299.3" y2="211.0" stroke="#2b1d26" stroke-width="9" stroke-linecap="round"/>

  <!-- Glass pill: amp status LEDs -->
  <rect x="186" y="345" width="140" height="24" rx="12" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.15"/>
  <circle cx="204" cy="357" r="4" fill="#22c55e"/>
  <circle cx="308" cy="357" r="4" fill="#f5b942"/>
</svg>
