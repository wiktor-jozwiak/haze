[workspace]
resolver = "2"
members = ["crates/katana-core", "crates/katana-midi", "crates/katana-studio", "crates/katana-art", "crates/haze-dsp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# cpal 0.15.3 with a fix for ALSA capture after an overrun (see vendor/cpal/HAZE-PATCH.md)
[patch.crates-io]
cpal = { path = "vendor/cpal" }
