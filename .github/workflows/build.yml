name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # oldest supported runner: the binary then runs on glibc 2.35+ (Ubuntu 22.04, Debian 12, Fedora 36+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev
      - name: Test
        run: cargo test --release --workspace --locked
      - name: Build
        run: cargo build --release --locked -p katana-studio
      - name: Package
        run: |
          d=haze-linux-x86_64
          mkdir "$d"
          cp target/release/haze packaging/install.sh packaging/haze.desktop packaging/haze.svg packaging/haze-*.png LICENSE "$d"/
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: haze-linux-x86_64
          path: haze-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    env:
      # static CRT: haze.exe runs without the Visual C++ redistributable
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p katana-studio
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/haze.exe --png shot.png --size 1280x800
          test -s shot.png
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory haze-windows-x86_64 | Out-Null
          Copy-Item target/release/haze.exe, packaging/windows/README.txt, LICENSE haze-windows-x86_64/
          Compress-Archive -Path haze-windows-x86_64 -DestinationPath haze-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: haze-windows-x86_64
          path: |
            haze-windows-x86_64.zip
            shot.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum haze-linux-x86_64.tar.gz haze-windows-x86_64.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            haze-linux-x86_64.tar.gz
            haze-windows-x86_64.zip
            SHA256SUMS
